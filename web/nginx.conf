server {
    listen 8080;
    server_name localhost 127.0.0.1;
    if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4500000;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    location /api/ { proxy_pass http://api:3000; proxy_set_header Host localhost:3000; proxy_request_buffering off; proxy_buffering off; proxy_read_timeout 15s; }
    location = /health { proxy_pass http://api:3000/health; proxy_set_header Host localhost:3000; }
    location / { try_files $uri $uri/ /index.html; }
}
